<style>
:root{--bg:#fafaf7;--sf:#fff;--tx:#1d1d1b;--mu:#76756f;--ln:#e3e1da;--ac:#2f6f5e;--ac2:#e3f0ec;--dg:#b3402e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--sf:#212120;--tx:#ecebe6;--mu:#9a9992;--ln:#34342f;--ac:#6fc2aa;--ac2:#25382f;--dg:#e5806d}}
:root[data-theme="dark"]{--bg:#171716;--sf:#212120;--tx:#ecebe6;--mu:#9a9992;--ln:#34342f;--ac:#6fc2aa;--ac2:#25382f;--dg:#e5806d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--ln);background:var(--sf)}
.ib{min-width:40px;height:40px;border-radius:10px;font-size:18px;display:grid;place-items:center}
.ib:active,.tb button:active{background:var(--ac2)}
#title{flex:1;min-width:0;border:0;background:none;color:var(--tx);font:600 18px/1.2 inherit;font-family:inherit;outline:0;padding:8px 4px}
.plus{color:var(--ac);font-size:30px;font-weight:300}#cal{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sf);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s;box-shadow:0 -8px 28px #0003}#cal.on{transform:none}.ch{display:flex;align-items:center;justify-content:space-between}.ch b{font-size:16px;text-transform:capitalize}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}.cg span{font-size:12px;color:var(--mu);padding:4px 0}.cg button{height:42px;border-radius:50%;position:relative;font-size:15px}.cg button:active{background:var(--ac2)}.cg button.td{background:var(--ac);color:var(--bg)}.cg button.dot:after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac)}.cg button.td.dot:after{background:var(--bg)}
.meta{display:flex;justify-content:space-between;padding:6px 16px;font-size:12px;color:var(--mu)}
#ed{flex:1;overflow:auto;padding:4px 16px 24px;outline:0;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:17px}
#ed:empty:before{content:attr(data-ph);color:var(--mu)}
#ed ul,#ed ol{margin:.3em 0;padding-left:1.6em}#ed>ol+ul{list-style:none;margin-left:0;padding-left:2.8em}#ed>ol+ul>li{position:relative}#ed>ol+ul>li::before{content:"\2022";position:absolute;left:-1.2em}#ed :is(ol,ul)>ul{padding-left:.75em}#ed :is(ol,ul)>ol{padding-left:.95em}#ed li>ul{padding-left:.75em}#ed li>ol{padding-left:.95em}#ed ol{list-style-type:decimal}#ed :is(ol,ul) ol{list-style-type:lower-alpha}#ed :is(ol,ul) :is(ol,ul) ol{list-style-type:lower-roman}#ed :is(ol,ul) :is(ol,ul) :is(ol,ul) ol{list-style-type:decimal}#ed ul{list-style-type:disc}#ed :is(ol,ul) ul{list-style-type:disc}#ed :is(ol,ul) :is(ol,ul) ul{list-style-type:square}#ed :is(ol,ul) :is(ol,ul) :is(ol,ul) ul{list-style-type:disc}.rtl{display:flex;gap:1ch}.rtl>.rt{margin-left:auto;text-align:right;white-space:pre-wrap}

#chip{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 8px;border-top:1px solid var(--ln);background:var(--sf)}#chip.on{display:flex}#chip button{flex:none;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:14px}#chip button:active{background:var(--ac2)}
.tb{display:flex;gap:2px;overflow-x:auto;padding:6px 6px;border-top:1px solid var(--ln);background:var(--sf);scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb button{flex:none;min-width:42px;height:42px;border-radius:10px;font-size:16px}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.tb button{display:grid;place-items:center;line-height:1}.tb .sep{flex:none;width:1px;background:var(--ln);margin:6px 4px}
.ov{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--sf);z-index:21;transform:translateX(-102%);transition:transform .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);border-right:1px solid var(--ln)}
#drawer.on{transform:none}
#q{margin:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;outline:0}
#list{flex:1;overflow:auto}
.it{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--ln)}
.it.cur{background:var(--ac2)}
.it .b{flex:1;min-width:0;text-align:left}
.it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.it .dl{flex:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--mu)}.it .dl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.it .dl:active{background:var(--ac2);color:var(--dg)}.it small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{position:fixed;z-index:30;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 8px 28px #0003;padding:6px;display:none}
.pop.on{display:block}
.pop button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:8px;font-size:15px}
.pop button:active{background:var(--ac2)}
#menu{top:calc(52px + env(safe-area-inset-top,0px));right:8px;min-width:210px}
#sym{bottom:calc(60px + env(safe-area-inset-bottom,0px));left:8px;right:8px;display:none;flex-wrap:wrap;gap:2px}
#sym.on{display:flex}
#sym button{width:44px;text-align:center;padding:10px 0;font-size:18px}
#dlg{position:fixed;inset:0;z-index:40;background:#0007;display:none;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}

#dlg h3{margin:0 0 10px;font-size:16px}
#dlg textarea{width:100%;height:150px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font:12px monospace}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);font-size:14px}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:50;display:none;gap:12px;align-items:center;white-space:nowrap}
#toast button{color:#9fe0c9;font-weight:600}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}}
#pr{display:none;padding:20px;white-space:pre-wrap}
</style></head><body>

 <button data-c="undo" title="Urungkan"><svg viewBox="0 0 20 20"><path d="M7 4 3 8l4 4M3 8h8a4.5 4.5 0 0 1 0 9H8"/></svg></button><button data-c="redo" title="Ulangi"><svg viewBox="0 0 20 20"><path d="M13 4l4 4-4 4M17 8H9a4.5 4.5 0 0 0 0 9h3"/></svg></button><button data-c="selectAll" title="Pilih semua"><svg viewBox="0 0 20 20"><path stroke-dasharray="2.5 2.5" d="M4 4h12v12H4z"/></svg></button><button id="bCopy" title="Salin"><svg viewBox="0 0 20 20"><path d="M7 7h9v10H7zM4 13V3h9"/></svg></button><button id="bPaste" title="Tempel"><svg viewBox="0 0 20 20"><path d="M7 3h6v3H7zM5 5H4v12h12V5h-1M7 10h6M7 13h6"/></svg></button><button id="bClr" title="Bersihkan"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button>
 <span class="sep"></span>

 <button id="fm">A−</button><button id="fp">A+</button>
 <span class="sep"></span>
 <button data-c="justifyLeft" title="Rata kiri"><svg viewBox="0 0 20 20"><path d="M3 4h14M3 8h9M3 12h14M3 16h9"/></svg></button><button data-c="justifyCenter" title="Tengah"><svg viewBox="0 0 20 20"><path d="M3 4h14M5.5 8h9M3 12h14M5.5 16h9"/></svg></button><button data-c="justifyRight" title="Rata kanan"><svg viewBox="0 0 20 20"><path d="M3 4h14M8 8h9M3 12h14M8 16h9"/></svg></button><button data-c="justifyFull" title="Kiri-kanan"><svg viewBox="0 0 20 20"><path d="M3 4h14M3 8h14M3 12h14M3 16h14"/></svg></button>
 <span class="sep"></span>
 <button id="bOut" title="Outdent"><svg viewBox="0 0 20 20"><path d="M3 4h14M9 8h8M9 12h8M3 16h14M6 7l-3 3 3 3"/></svg></button><button id="bTab" title="Indent"><svg viewBox="0 0 20 20"><path d="M3 4h14M9 8h8M9 12h8M3 16h14M3 7l3 3-3 3"/></svg></button><button id="bGap" title="Tab: geser kata sebesar ukuran indent"><svg viewBox="0 0 20 20"><path d="M3 10h10M10 7l3 3-3 3M17 4v12"/></svg></button>
 <button data-c="insertOrderedList">1.</button><button data-c="insertUnorderedList">•</button><button id="bChk">☐</button><button id="bSym">Ω</button><button id="bDate" title="Tanggal"><svg viewBox="0 0 20 20"><path d="M4 5h12v11H4zM4 9h12M7 3v3M13 3v3"/></svg></button>
</div>

 <button data-m="pdf">📄 Simpan PDF</button><button data-m="png">🖼 Simpan PNG</button><button data-m="copy">📋 Salin teks</button><button data-m="pin">📌 Pin / lepas pin</button><button data-m="bak">💾 Backup / Restore</button><button data-m="ind">⇥ Ukuran indent: <span id="isz">4</span></button><button data-m="dark">🌓 Mode gelap</button><button data-m="del" style="color:var(--dg)">🗑 Hapus catatan</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),ed=$('#ed'),ti=$('#title');
let S={notes:[],cur:null,indent:4,theme:''},saveT;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const fmt=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const fmtT=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace(/\./g,':');
function load(){try{const r=localStorage.getItem('catatan_taktis');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function persist(){try{localStorage.setItem('catatan_taktis',JSON.stringify(S));return true}catch(e){return false}}
const note=()=>S.notes.find(n=>n.id===S.cur);
function newNote(){const n={id:uid(),title:'',html:'',fs:17,pin:false,created:Date.now(),updated:Date.now()};S.notes.unshift(n);S.cur=n.id;return n}
function text(){return ed.innerText.replace(/\u00a0/g,' ')}
function plainTitle(n){return n.title.trim()||(n.html?(()=>{const d=document.createElement('div');d.innerHTML=n.html.replace(/<(br|\/div|\/p|\/li)>/gi,'\n');return d.textContent.split('\n').map(s=>s.trim()).find(Boolean)||''})():'')||'Tanpa judul'}
function show(){const n=note();ti.value=n.title;ed.innerHTML=n.html;normInd();unrow();unal();ed.style.fontSize=n.fs+'px';$('#dt').textContent=fmt(n.updated);stat(true);$('#isz').textContent=S.indent;ed.style.tabSize=S.indent;applyTheme()}
function stat(ok){const w=(text().trim().match(/\S+/g)||[]).length;$('#st').textContent=(ok?'Tersimpan ✓':'Menyimpan…')+' · '+w+' kata'}
function commit(){const n=note();if(!n)return;n.title=ti.value;n.html=ed.innerHTML;n.updated=Date.now();persist();$('#dt').textContent=fmt(n.updated);stat(true);renderList()}
function sched(){stat(false);clearTimeout(saveT);saveT=setTimeout(commit,500)}
ed.addEventListener('input',sched);ti.addEventListener('input',sched);
window.addEventListener('pagehide',commit);
document.addEventListener('visibilitychange',()=>{if(document.hidden)commit()});

function renderList(){const q=$('#q').value.toLowerCase();let a=S.notes.filter(n=>!q||(plainTitle(n)+' '+n.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q));
a.sort((x,y)=>(y.pin-x.pin)||(y.updated-x.updated));
$('#list').innerHTML='';a.forEach(n=>{const d=document.createElement('div');d.className='it'+(n.id===S.cur?' cur':'');
const sn=n.html.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').trim().slice(0,60);
d.innerHTML='<button class="b"><b></b><small></small></button><span>'+(n.pin?'📌':'')+'</span><button class="dl" aria-label="Hapus catatan"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg></button>';
d.querySelector('b').textContent=plainTitle(n);d.querySelector('small').textContent=fmt(n.updated)+' · '+sn;
d.querySelector('.b').onclick=()=>{commit();S.cur=n.id;persist();show();drawer(false)};d.querySelector('.dl').onclick=e=>{e.stopPropagation();delById(n.id)};$('#list').appendChild(d)});
if(!a.length)$('#list').innerHTML='<p style="padding:16px;color:var(--mu)">Tidak ada catatan.</p>'}
function drawer(o){$('#drawer').classList.toggle('on',o);$('#ov').classList.toggle('on',o);if(o)renderList()}
$('#bMenu').onclick=()=>drawer(true);$('#ov').onclick=()=>{drawer(false);pops()};$('#q').oninput=renderList;
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX<22?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchmove',e=>{if(tx!==null&&e.touches[0].clientX-tx>50){drawer(true);tx=null}},{passive:true});
$('#drawer').addEventListener('touchstart',e=>{$('#drawer')._x=e.touches[0].clientX},{passive:true});
$('#drawer').addEventListener('touchmove',e=>{if($('#drawer')._x-e.touches[0].clientX>60){drawer(false)}},{passive:true});

function newN(){commit();const c=note();if(c&&!c.title&&!c.html&&S.notes.length>1){}newNote();persist();show();drawer(false);ed.focus()}
$('#bNew').onclick=newN;

function toast(msg,act,fn){const t=$('#toast');t.innerHTML='<span></span>'+(act?'<button>'+act+'</button>':'');t.firstChild.textContent=msg;t.style.display='flex';if(act)t.querySelector('button').onclick=()=>{fn();t.style.display='none'};clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',5000)}
function pops(){$('#cal').classList.remove('on');$('#menu').classList.remove('on');$('#sym').classList.remove('on');$('#ov').classList.remove('on')}
function pop(el){const o=el.classList.contains('on');pops();if(!o){el.classList.add('on');$('#ov').classList.add('on')}}
$('#bMore').onclick=()=>pop($('#menu'));$('#bSym').onclick=()=>pop($('#sym'));
['•','◦','▪','→','←','↑','↓','✓','✗','★','☆','♥','©','®','™','°','±','×','÷','≠','≈','≤','≥','…','—','§','€','£','¥','₿','№','⚠','☐','☑'].forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onmousedown=e=>e.preventDefault();b.onclick=()=>{ins(s)};$('#sym').appendChild(b)});

function ins(t){ed.focus();document.execCommand('insertText',false,t);sched()}
document.querySelectorAll('[data-c]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{ed.focus();const c=b.dataset.c,li=curLi();if(li&&/^insert(Un)?orderedList$/.test(c)&&!li.textContent.trim()&&!li.querySelector('li')&&li.previousElementSibling){const w=c==='insertOrderedList'?'OL':'UL';if(li.parentNode.tagName!==w)document.execCommand('indent')}document.execCommand(c);sched()}});
$('#tb').querySelectorAll('button').forEach(b=>b.onmousedown=e=>e.preventDefault());
$('#bClr').onclick=()=>{ed.focus();document.execCommand('selectAll');document.execCommand('delete');sched();toast('Catatan dibersihkan','Urungkan',()=>{ed.focus();document.execCommand('undo');sched()})};
function atLineStart(){const s=getSelection();if(!s.rangeCount)return true;if(!s.isCollapsed)return true;const n=s.anchorNode,o=s.anchorOffset,el=n.nodeType===3?n.parentNode:n,b=el.closest&&el.closest('li,div,p');if(b&&b!==ed){const r=document.createRange();r.setStart(b,0);r.setEnd(n,o);return r.toString()===''}let t=n;while(t.parentNode!==ed)t=t.parentNode;let x=n.nodeType===3?n.data.slice(0,o):'',p=t.previousSibling;while(p&&p.nodeName!=='BR'&&!isB(p)){x=(p.textContent||'')+x;p=p.previousSibling}return x===''}
$('#bTab').onclick=()=>{if(!atLineStart()){ins('\t');return}if(curLi()){ed.focus();document.execCommand('indent');sched()}else blockInd(1)};
$('#bOut').onclick=()=>{if(curLi()){ed.focus();document.execCommand('outdent');sched();return}ed.focus();blockInd(-1);return;const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType!==3)return;let o=r.startOffset,k=0;while(k<S.indent&&o>0&&/[ \u00a0]/.test(n.data[o-1])){o--;k++}if(k){const rr=document.createRange();rr.setStart(n,o);rr.setEnd(n,r.startOffset);s.removeAllRanges();s.addRange(rr);document.execCommand('delete');sched()}};
ed.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();e.shiftKey?$('#bOut').click():$('#bTab').click()}});
$('#bChk').onclick=()=>ins('☐ ');
ed.addEventListener('click',e=>{const s=getSelection();if(!s.rangeCount||!s.isCollapsed)return;const r=s.getRangeAt(0),n=r.startContainer;if(n.nodeType!==3)return;const o=r.startOffset;for(const i of [o-1,o]){const c=n.data[i];if(c==='☐'||c==='☑'){const rr=document.createRange();rr.setStart(n,i);rr.setEnd(n,i+1);s.removeAllRanges();s.addRange(rr);document.execCommand('insertText',false,c==='☐'?'☑':'☐');sched();return}}});
function curLi(){const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return null;let n=s.anchorNode;if(n.nodeType===3)n=n.parentNode;return n.closest?n.closest('li'):null}
function chip(){const li=curLi(),c=$('#chip'),was=c.classList.contains('on'),on=!!li&&document.activeElement===ed;c.classList.toggle('on',on);if(on&&!was)setTimeout(()=>{const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0).cloneRange();r.collapse(false);const q=r.getClientRects()[0]||r.startContainer.parentNode.getBoundingClientRect(),eb=ed.getBoundingClientRect();if(q.bottom>eb.bottom-12)ed.scrollTop+=q.bottom-eb.bottom+24},50);if(li){const o=li.parentNode.tagName==='OL';$('#cCont').style.display=o?'':'none';$('#cSt').style.display=o?'':'none'}}
document.addEventListener('selectionchange',chip);
